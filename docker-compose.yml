services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: price_watcher_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - price_watcher_net

  nginx:
    image: nginx:alpine
    container_name: price_watcher_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - price_watcher_net

  mysql:
    image: mysql:8.0
    container_name: price_watcher_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: price_watcher
      MYSQL_USER: price_watcher
      MYSQL_PASSWORD: secret_password
      MYSQL_ROOT_PASSWORD: root_secret_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret_password"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - price_watcher_net

  redis:
    image: redis:7-alpine
    container_name: price_watcher_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - price_watcher_net

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: price_watcher_queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: sh -c "sleep 5 && php artisan queue:work redis --sleep=3 --tries=3 --timeout=90"
    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      app:
        condition: service_started
    networks:
      - price_watcher_net

networks:
  price_watcher_net:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
